name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The spec job: the API changes on its own schedule, not on this repo's.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    name: generate, lint, vet
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # tfplugindocs reads the provider's schema through terraform.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # ⚠️ First, for the same reason as the portal's check:api — a stale
      # client makes every later failure a symptom.
      - name: client.gen.go and docs/ are what go generate makes
        run: |
          go generate ./...
          git add --intent-to-add docs
          git diff --exit-code -- internal/client docs

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      # Reachable vulnerabilities only, in dependencies and the Go release
      # go.mod names. A release built on a vulnerable toolchain ships it.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  # Both binaries, since the provider is meant for both registries. The
  # tests serve the provider in-process to the real CLI against a fake API;
  # acceptance tests against a real organization are DAWG-139.
  test:
    name: test (${{ matrix.cli }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: go test
        run: |
          if [ "${{ matrix.cli }}" = tofu ]; then
            # The test harness addresses the provider as
            # registry.terraform.io/<namespace>/updawg; tofu finds it only
            # under the namespace it was told.
            export TF_ACC_TERRAFORM_PATH="$(command -v tofu)" TF_ACC_PROVIDER_NAMESPACE=hashicorp
          else
            export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          fi
          go test -count=1 ./...

  # DAWG-139: every resource against a real test organization. Skips (and
  # passes) until the repository has the secrets UPDAWG_ACC_ORG and
  # UPDAWG_ACC_TOKEN — see TestAcceptance for what the org needs. One run
  # at a time, since the runs share the organization.
  acceptance:
    name: acceptance (real API)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency: acceptance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: go test -run TestAcceptance
        env:
          TF_ACC: "1"
          UPDAWG_ORG: ${{ secrets.UPDAWG_ACC_ORG }}
          UPDAWG_API_TOKEN: ${{ secrets.UPDAWG_ACC_TOKEN }}
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          go test -count=1 -v -run TestAcceptance ./internal/provider/

  # Daily: is the copy of the spec still what the API serves? When it fails,
  # `make spec`, `go generate ./...`, and look at what changed — a field the
  # provider reads may have moved.
  spec:
    name: openapi.json is what the API serves
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -fsS https://api.updawg.net/openapi.json -o served.json
          cmp internal/client/openapi.json served.json
